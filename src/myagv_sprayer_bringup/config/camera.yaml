camera_stream_node:
  ros__parameters:
    # 'source' (v4l2 | topic) is deliberately NOT set here: a --params-file
    # value wins over a launch-time `-p`/dict override for the same key
    # regardless of argument order, so defining it in this shared file would
    # make sim_full.launch.py's `{'source': 'topic'}` override silently
    # no-op and fall back to the real /dev/video0 camera even in Gazebo.
    # hardware.launch.py relies on camera_stream_node's own 'v4l2' default;
    # sim_full.launch.py sets 'topic' via its launch-time override.
    device: /dev/video0
    input_topic: /camera/image_raw
    width: 640
    height: 480
    fps: 10.0
    jpeg_quality: 75
    frame_id: camera_optical_frame
    # Intrinsics of the stock myAGV camera at 640x480 - replace with your
    # own calibration (ros2 run camera_calibration cameracalibrator ...)
    fx: 520.0
    fy: 520.0
    cx: 320.0
    cy: 240.0
